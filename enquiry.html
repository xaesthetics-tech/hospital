<main class="inner-page">

    <section class="enquiry">

        <div class="enquiry-info">

            <div class="section-label">
                <span>03</span>
                APPOINTMENT
            </div>

            <h1>
                Let's take care
                <em>of you.</em>
            </h1>

            <p>
                Tell us what you need and our team will
                get back to you shortly.
            </p>

            <div class="contact-mini">

                <strong>24/7 Helpline</strong>

                <span>+91 12345 67890</span>

            </div>

        </div>


        <form class="premium-form">

            <div class="form-row">

                <label>
                    Full Name
                    <input
                        type="text"
                        placeholder="Your name"
                        required
                    >
                </label>

                <label>
                    Phone Number
                    <input
                        type="tel"
                        placeholder="+91"
                        required
                    >
                </label>

            </div>


            <div class="form-row">

                <label>
                    Email
                    <input
                        type="email"
                        placeholder="you@email.com"
                    >
                </label>

                <label>
                    Department

                    <select>

                        <option>Select Department</option>
                        <option>Cardiology</option>
                        <option>Neurology</option>
                        <option>Orthopaedics</option>
                        <option>Emergency</option>

                    </select>

                </label>

            </div>


            <label>
                Preferred Date

                <input type="date">

            </label>


            <label>
                Message

                <textarea
                    rows="5"
                    placeholder="Tell us how we can help..."
                ></textarea>

            </label>


            <button
                type="submit"
                class="primary-button"
            >
                Send Enquiry →
            </button>

        </form>

    </section>

</main>
